<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>正在更新到 V12.1</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0f14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    h1{font-size:30px;margin:0 0 14px}.status{color:#aeb8c5;font-size:18px;line-height:1.6}
  </style>
</head>
<body>
  <main><h1>正在清除 V11 旧缓存</h1><div id="status" class="status">完成后会自动进入 V12.1。</div></main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter(registration => registration.scope.includes('/cod11-live-translator/'))
            .map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys
            .filter(key => /cod11|realtime|translator/i.test(key))
            .map(key => caches.delete(key)));
        }
        status.textContent = '旧缓存已清除，正在打开 V12.1……';
      } catch (error) {
        status.textContent = '清理完成，正在重新打开……';
      }
      setTimeout(() => {
        location.replace('./index.html?fresh=121-' + Date.now());
      }, 600);
    })();
  </script>
</body>
</html>
