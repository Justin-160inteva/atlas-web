name: Geospatial Sakai P06 authorized evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/geospatial-2p5d-sakai-p006-evidence.yml'
      - 'tools/plan_geospatial_2p5d_sakai_p006.py'
      - 'tools/sakai_p006_evidence_smoke.py'
      - 'tools/download_authorized_bilibili_page_by_cid.py'
      - 'tools/extract_geospatial_2p5d_sakai_p006.py'
      - 'data/geospatial/geospatial-2p5d-sakai-p006-scan-plan.json'
      - 'data/geospatial/geospatial-2p5d-sakai-p006-timestamps.json'
      - 'data/analysis-jobs/eleven-p006.json'
      - 'data/analysis-results/eleven-p006.json'
      - 'data/authorizations.json'

permissions:
  contents: read

concurrency:
  group: geospatial-sakai-p006-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install transient dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy opencv-python-headless curl-cffi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Compile and regenerate pixel-free plan
        run: |
          python -m py_compile \
            tools/plan_geospatial_2p5d_sakai_p006.py \
            tools/sakai_p006_evidence_smoke.py \
            tools/download_authorized_bilibili_page_by_cid.py \
            tools/extract_geospatial_2p5d_sakai_p006.py
          python tools/plan_geospatial_2p5d_sakai_p006.py
          git diff --exit-code -- data/geospatial/geospatial-2p5d-sakai-p006-timestamps.json

      - name: Run exact 500-check authorization and sampling gate
        run: python tools/sakai_p006_evidence_smoke.py

      - name: Prove media cannot be written into the repository
        run: |
          if python tools/download_authorized_bilibili_page_by_cid.py \
            --job data/analysis-jobs/eleven-p006.json \
            --authorization-registry data/authorizations.json \
            --output-dir data/forbidden-media-output; then
            exit 1
          fi
          test ! -e data/forbidden-media-output

      - name: Download explicit authorized P06 page transiently
        run: |
          mkdir -p /tmp/atlas-sakai-p006-video /tmp/atlas-sakai-p006-evidence
          python tools/download_authorized_bilibili_page_by_cid.py \
            --job data/analysis-jobs/eleven-p006.json \
            --authorization-registry data/authorizations.json \
            --output-dir /tmp/atlas-sakai-p006-video \
            --quality 32

      - name: Extract private low-resolution review evidence
        run: |
          python tools/extract_geospatial_2p5d_sakai_p006.py \
            --video /tmp/atlas-sakai-p006-video/eleven-p006-v2.mp4 \
            --output-dir /tmp/atlas-sakai-p006-evidence \
            --run-id '${{ github.run_id }}'
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/atlas-sakai-p006-evidence')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'p006-private-review-artifact-ready'
          assert manifest['authorizationId'] == 'auth-eleven-game-world-20260719'
          assert len(manifest['extraction']['frames']) == 352
          assert len(manifest['extraction']['contactSheets']) == 22
          assert manifest['privacy']['artifactRetentionDays'] == 1
          assert manifest['modeling']['geometryGenerated'] is False
          assert all((root / row['filename']).is_file() for row in manifest['extraction']['frames'])
          assert all((root / row['filename']).is_file() for row in manifest['extraction']['contactSheets'])
          assert not list(Path('.').rglob('*.mp4'))
          assert not list(Path('data').rglob('*.jpg'))
          assert not list(Path('data').rglob('*.png'))
          PY

      - name: Upload one-day private P06 review artifact
        uses: actions/upload-artifact@v6
        with:
          name: atlas-sakai-p006-private-review-${{ github.run_id }}
          path: /tmp/atlas-sakai-p006-evidence
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

      - name: Delete transient media and pixels
        if: always()
        run: |
          rm -rf /tmp/atlas-sakai-p006-video /tmp/atlas-sakai-p006-evidence
          test ! -e /tmp/atlas-sakai-p006-video
          test ! -e /tmp/atlas-sakai-p006-evidence
